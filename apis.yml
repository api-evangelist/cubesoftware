aid: cubesoftware
name: Cube
description: >-
  Cube is an AI-powered financial planning and analysis (FP&A) platform for finance teams.
  It connects a company's source systems and spreadsheets into a single financial data model,
  letting teams budget, forecast, run scenario and what-if analysis, and report from the comfort
  of Excel and Google Sheets. The Cube API (OAuth 2.0, 296 operations across data tables,
  dimensions, formulas, exports, and company administration) exposes the same functionality that
  powers Cube's universal spreadsheet add-ons and integrations, so teams can push and pull their
  financial data programmatically. Cube is SOC 2 Type II certified and GDPR-compliant, built on AWS.
